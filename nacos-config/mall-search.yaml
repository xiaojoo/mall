# Nacos Config for mall-search
# Data ID: mall-search.yaml
# Group: DEFAULT_GROUP
# Format: YAML

spring:
  # datasource: 本服务无数据库访问（纯 Redis/ES/消息），移除残留配置
  data:
    redis:
      host: ${SERVER_IP:localhost}
      port: 6379
      password: CHANGE_ME
      database: 0
      timeout: 10s
  
  elasticsearch:
    uris: ${SERVER_IP:localhost}:9200
  
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 10019

logging:
  level:
    root: INFO
    com.mall.search: DEBUG

# 搜索结果列表页链接（按需修改）
mall:
  search:
    list-url: http://search.example.com/list.html?