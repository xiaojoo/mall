# Nacos Config for mall-order
# Data ID: mall-order.yaml
# Group: DEFAULT_GROUP
# Format: YAML

spring:
  rabbitmq:
    host: ${SERVER_IP:localhost}
    port: 5672
    username: guest
    password: CHANGE_ME
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
  datasource:
    username: root
    password: CHANGE_ME
    url: jdbc:mysql://${SERVER_IP:localhost}:3306/mall_oms?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
  
  data:
    redis:
      host: ${SERVER_IP:localhost}
      port: 6379
      password: CHANGE_ME
      database: 0
      timeout: 10s
  
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 10015

logging:
  level:
    root: INFO
    com.mall.order: DEBUG

# 会员端 JWT（C 端登录态，微博/微信 OAuth 签发，业务服务解析；生产环境务必修改 secret）
member:
  jwt:
    secret: YOUR_MEMBER_JWT_SECRET_AT_LEAST_32_BYTES
    expire-seconds: 604800
    header: token

# 未登录跳转前端地址（按需修改）
mall:
  web:
    login-url: http://example.com/#/login