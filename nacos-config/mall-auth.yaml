# Nacos Config for mall-auth
# Data ID: mall-auth.yaml
# Group: DEFAULT_GROUP
# Format: YAML

spring:
  datasource:
    username: root
    password: CHANGE_ME
    url: jdbc:mysql://${SERVER_IP:localhost}:3306/mall_auth?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
  
  data:
    redis:
      host: ${SERVER_IP:localhost}
      port: 6379
      password: CHANGE_ME
      database: 0
      timeout: 10s
  
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 10011

logging:
  level:
    root: INFO
    com.mall.auth: DEBUG

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# JWT 双 token + 黑名单配置（生产环境务必修改 secret）
auth:
  jwt:
    secret: YOUR_AUTH_JWT_SECRET_AT_LEAST_32_BYTES
    access-expire-seconds: 1800
    refresh-expire-seconds: 604800
    header: token

# 会员端 JWT（C 端登录态，微博/微信 OAuth 签发，业务服务解析；生产环境务必修改 secret）
member:
  jwt:
    secret: YOUR_MEMBER_JWT_SECRET_AT_LEAST_32_BYTES
    expire-seconds: 604800
    header: token

# 微博 OAuth 登录（只改这里即可，无需改代码）
weibo:
  client-id: CHANGE_ME_WEIBO_CLIENT_ID
  client-secret: CHANGE_ME_WEIBO_CLIENT_SECRET
  redirect-uri: http://${SERVER_IP:localhost}:88/oauth2.0/weibo/success
  api-host: https://api.weibo.com

# 会员/登录跳转前端地址（按需修改）
mall:
  oauth:
    success-redirect: http://${SERVER_IP:localhost}:8088/
    token-redirect: http://${SERVER_IP:localhost}:8088/?token=
    login-redirect: http://${SERVER_IP:localhost}:8088/#/login