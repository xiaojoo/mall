spring:
  config:
    import: "nacos:mall-admin.yaml"
  application:
    name: mall-admin
  cloud:
    nacos:
      server-addr: ${SERVER_IP:localhost}:8848
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: ${SERVER_IP:localhost}:8848
  datasource:
    username: root
    password: ${MYSQL_PASSWORD:admin123}
    url: jdbc:mysql://${SERVER_IP:localhost}:3306/mall_admin?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
  data:
    redis:
      host: ${SERVER_IP:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:123456}
      database: 0
      timeout: 10s
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# 本地开发保留 Swagger；生产环境（nacos-config/mall-admin.yaml）已关闭
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true

server:
  port: 10012

logging:
  level:
    root: INFO
    com.mall.admin: DEBUG
    org.springdoc: error
