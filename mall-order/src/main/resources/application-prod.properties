spring.application.name=mall-order
server.port=10015
spring.cloud.nacos.discovery.server-addr=${SERVER_IP:localhost}:8848
spring.rabbitmq.host=${SERVER_IP:localhost}
spring.rabbitmq.port=5672
#spring.rabbitmq.username=root
#spring.rabbitmq.password=CHANGE_ME
spring.rabbitmq.virtual-host=/
# 开启发送端确认
spring.rabbitmq.publisher-confirm-type=correlated
# 开启发送端消息抵达对列的确认
spring.rabbitmq.publisher-returns=true
# 只要消息抵达Queue，就会异步发送优先回调returnfirm
spring.rabbitmq.template.mandatory=true
#手动ack消息
spring.rabbitmq.listener.simple.acknowledge-mode=manual
#session存入redis
spring.session.store-type=redis
#配置线程池
mall.thread.coreSize=20
mall.thread.maxSize=200
mall.thread.keepAliveTime=10

spring.mvc.format.date=yyyy-MM-dd HH:mm:ss


spring.datasource.driver-class-name= com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${SERVER_IP:localhost}:3306/mall_oms
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:admin123}

spring.data.redis.host=${SERVER_IP:localhost}
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:123456}

#????????
alipay.app_id=9021000133698831
alipay.merchant_private_
alipay.alipay_public_
alipay.notify_url=http://CHANGE_ME_PUBLIC_IP/payed/notify
alipay.return_url=http://${SERVER_IP:localhost}/memberOrder.html
alipay.sign_type=RSA2
alipay.charset=utf-8
alipay.gatewayUrl=https://openapi-sandbox.dl.alipaydev.com/gateway.do

spring.cloud.sentinel.transport.dashboard=${SERVER_IP:localhost}:8333
management.endpoints.web.exposure.include=*
feign.sentinel.enabled=true
