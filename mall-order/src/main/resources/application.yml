spring:
  config:
    import: "nacos:mall-order.yaml"
  application:
    name: mall-order
  cloud:
    nacos:
      server-addr: ${SERVER_IP:localhost}:8848
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: ${SERVER_IP:localhost}:8848
  rabbitmq:
    host: ${SERVER_IP:localhost}
    port: 5672
    username: guest
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
  datasource:
    username: root
    password: ${MYSQL_PASSWORD:admin123}
    url: jdbc:mysql://${SERVER_IP:localhost}:3306/mall_oms?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
  data:
    redis:
      host: ${SERVER_IP:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:123456}
      database: 0
      timeout: 10s
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 10015

logging:
  level:
    root: INFO
    com.mall.order: DEBUG
    # 支付宝 SDK 业务失败（主动查单 TRADE_NOT_EXIST 等）默认打 ERROR 且含整包报文，降为 WARN 减少噪音
    sdk.biz.err: WARN

# 会员端 JWT（C 端登录态，微博/微信 OAuth 签发，业务服务解析；生产环境务必修改 secret）
member:
  jwt:
    secret: YOUR_MEMBER_JWT_SECRET_AT_LEAST_32_BYTES
    expire-seconds: 604800
    header: token
