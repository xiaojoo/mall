spring:
  config:
    import: "nacos:mall-product.yaml"
  application:
    name: mall-product
  cloud:
    nacos:
      server-addr: ${SERVER_IP:localhost}:8848
      discovery:
        server-addr: ${SERVER_IP:localhost}:8848
  datasource:
    username: root
    password: CHANGE_ME
    url: jdbc:mysql://${SERVER_IP:localhost}:3306/mall_pms?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000
  data:
    redis:
      host: ${SERVER_IP:localhost}
      port: 6379
      password: CHANGE_ME
      database: 0
      timeout: 10s
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      # 本地扩展：逻辑删除（nacos 未配置，保留本地行为）
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

server:
  port: 10013

# 日志配置
logging:
  level:
    root: INFO
    com.mall.product: DEBUG
