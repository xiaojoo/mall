spring.application.name=mall-product
spring.cloud.nacos.discovery.server-addr=${SERVER_IP:localhost}:8848
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
#spring.cache.redis.key-prefix=CACHE_
spring.cache.redis.use-key-prefix=true
# 是否缓存空值，放置缓存穿透
spring.cache.redis.cache-null-values=true
#配置线程池
mall.thread.coreSize=20
mall.thread.maxSize=200
mall.thread.keepAliveTime=10
#session存入redis
spring.session.store-type=redis
spring.cloud.sentinel.transport.dashboard=${SERVER_IP:localhost}:8333
management.endpoints.web.exposure.include=*
feign.sentinel.enabled=true
logging.level.org.springframework.cloud.openfeign=debug
# ????
management.zipkin.tracing.endpoint=http://${SERVER_IP:localhost}:9411/
# ??????
# ?????
management.tracing.sampling.probability=1.0