apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: "demo.pipeline"
spec:
  params:
  - name: image-registry
    default: crpi-jnk3ch80my2cet7k.cn-shenzhen.personal.cr.aliyuncs.com/mall-devops
  - name: image-repo-name
    type: string
  - name: repo_url
    type: string
  - name: repo_revision
    type: string
  workspaces:
  - name: git-source
  - name: docker-regcred
  tasks:
  - name: fetch-from-git
    taskRef:
      name: git-clone
    params:
    - name: repo_url
      value: $(params.repo_url)
    - name: revision
      value: $(params.repo_revision)
    - name: deleteExisting
      value: "true"
    workspaces:
    - name: output
      workspace: git-source
  - name: build-maven
    runAfter: [fetch-from-git]
    taskRef:
      name: maven-build
    workspaces:
    - name: source
      workspace: git-source
    params:
    - name: MAVEN_COMMAND
      value: clean package
  - name: build-image
    runAfter: [build-maven]
    taskRef:
      name: kaniko
    params:
    - name: IMAGE
      value: $(params.image-registry)/$(params.image-repo-name):$(tasks.fetch-from-git.results.commit)
    - name: CONTEXT
      value: mall-gateway
    - name: DOCKERFILE
      value: $(workspaces.source.path)/mall-gateway/Dockerfile
    workspaces:
    - name: source
      workspace: git-source
    - name: dockerconfig
      workspace: docker-regcred
