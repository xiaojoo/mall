server.port=10022
spring.cloud.sentinel.transport.dashboard=${SERVER_IP:localhost}:8333
management.endpoints.web.exposure.include=*
feign.sentinel.enabled=true

# MinIO 对象存储（注意：代码 @Value 读取的是驼峰命名，不能写成 access-key；endpoint/密钥需改为实际值）
minio.endpoint=http://${SERVER_IP:localhost}:9000
minio.accessKey=CHANGE_ME_MINIO
minio.secretKey=CHANGE_ME_MINIO
minio.bucketName=default
# 预签名 URL 有效期（天）
minio.urlExpiryDays=7
# 公开读模式：true 时上传直接返回永久 URL（需存储桶为公开读策略，建桶时自动设置）
minio.publicRead=true
# 允许上传的文件类型前缀（逗号分隔），默认仅图片
minio.allowedContentTypes=image/,text/,application/pdf,application/msword,application/vnd.ms-,application/vnd.openxmlformats-officedocument.,application/octet-stream,video/webm,audio/wav
# 单文件大小上限（MB）
minio.maxFileSizeMB=150

# 文件上传大小限制（MinIO 控制器限制：单文件 150MB，最多 10 个，对应请求体上限 1GB）
spring.servlet.multipart.max-file-size=150MB
spring.servlet.multipart.max-request-size=1GB