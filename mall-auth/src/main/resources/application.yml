spring:
  config:
    import: "nacos:mall-auth.yaml"
  application:
    name: mall-auth
  cloud:
    nacos:
      server-addr: ${SERVER_IP:localhost}:8848
      discovery:
        server-addr: ${SERVER_IP:localhost}:8848
  datasource:
    username: root
    password: CHANGE_ME
    url: jdbc:mysql://${SERVER_IP:localhost}:3306/mall_auth?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
  data:
    redis:
      host: ${SERVER_IP:localhost}
      port: 6379
      password: CHANGE_ME
      database: 0
      timeout: 10s
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 10011

logging:
  level:
    root: INFO
    com.mall.auth: DEBUG

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# JWT 双 token + 黑名单配置（生产环境务必通过 nacos 覆盖 secret）
auth:
  jwt:
    secret: YOUR_AUTH_JWT_SECRET_AT_LEAST_32_BYTES
    access-expire-seconds: 1800
    refresh-expire-seconds: 604800
    header: token

# 会员端 JWT（C 端登录态，微博/微信 OAuth 签发；AuthApiController/OAuth2Controller 使用）
member:
  jwt:
    secret: YOUR_MEMBER_JWT_SECRET_AT_LEAST_32_BYTES
    expire-seconds: 604800
    header: token
