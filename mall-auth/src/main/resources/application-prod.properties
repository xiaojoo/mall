spring.application.name=mall-auth
server.port=10011


spring.data.redis.host=${SERVER_IP:localhost}
spring.data.redis.port=6379
spring.data.redis.password=CHANGE_ME
spring.session.store-type=redis
server.servlet.session.timeout=30m

management.endpoints.web.exposure.include=*
feign.sentinel.enabled=true

spring.cloud.sentinel.transport.dashboard=${SERVER_IP:localhost}:8333
spring.cloud.nacos.discovery.server-addr=${SERVER_IP:localhost}:8848

# 生产环境关闭 API 文档
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
