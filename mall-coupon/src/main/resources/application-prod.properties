spring.application.name=mall-coupon
server.port=10018

management.endpoints.web.exposure.include=*
feign.sentinel.enabled=true

spring.data.redis.host=${SERVER_IP:localhost}
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:123456}

spring.cloud.sentinel.transport.dashboard=${SERVER_IP:localhost}:8333
spring.cloud.nacos.discovery.server-addr=${SERVER_IP:localhost}:8848

spring.datasource.url=jdbc:mysql://${SERVER_IP:localhost}:3306/mall_sms
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:admin123}


mybatis-plus.mapper-locations=classpath:/mapper/**/*.xml
mybatis-plus.global-config.db-config.id-type=auto
